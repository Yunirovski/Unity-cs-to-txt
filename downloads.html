<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>downloads</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #111;
      color: #fff;
      font-family: Arial, sans-serif;
    }
    .wrap {
      width: min(520px, calc(100vw - 32px));
      display: grid;
      gap: 12px;
    }
    a {
      display: block;
      padding: 16px 18px;
      border: 1px solid #333;
      border-radius: 10px;
      color: #fff;
      text-decoration: none;
      background: #1a1a1a;
    }
    a:hover { background: #222; }
  </style>
</head>
<body>
  <div class="wrap" id="list"></div>

  <script>
    const files = [
      { name: 'Download File 1', path: './files/1.zip' },
    ];

    const list = document.getElementById('list');
    list.innerHTML = files.map(file => `
      <a href="${file.path}" download>${file.name}</a>
    `).join('');
  </script>
</body>
</html>
